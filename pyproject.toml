[project]
name = "wk-auth"
version = "0.2.0"
description = "Shared authentication for self-hosted w-k.io apps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "fastapi-users[sqlalchemy]>=13.0",
    "cryptography>=43.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Only apps that pass oidc= to build_auth() need this — kept out of the
# base install so the many apps that only want local password login don't
# pull in httpx-oauth.
oidc = [
    "fastapi-users[oauth]>=13.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "asgi-lifespan>=2.1",
    "wk-auth[oidc]",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
